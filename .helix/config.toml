# Helix editor configuration for this project
# This config is specific to this workspace and overrides global settings

[editor]
# Editor configuration

[editor.file-picker]
hidden = false    # Show hidden files (dotfiles)
git-ignore = true # Respect .gitignore patterns
ignore = true     # Enable ignore patterns
max-depth = 10    # Limit directory traversal depth

[editor.search]
smart-case = true  # Enable smart case searching
wrap-around = true # Wrap search around file

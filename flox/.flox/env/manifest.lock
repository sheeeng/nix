    "hook": {
      "on-activate": "  echo \"\"\n  echo \"🚀 Activating Flox environment....\"\n  echo \"Flox '$(flox --version)' located in '$(which flox)'.\"\n  echo \"Nix '$(nix --version | awk '{print $3}')' located in '$(which nix)'.\"\n  # keep-sorted start\n  echo \"Az '$(az --version 2>/dev/null | head --lines 1 | awk '{print $2}')' located in '$(which az)'.\"\n  echo \"GnuGrep '$(grep --version | head --lines 1 | awk '{print $4}')' located in '$(which grep)'.\"\n  echo \"Pre-commit '$(pre-commit --version | awk '{print $2}' )' located in '$(which pre-commit)'.\"\n  echo \"Pyenv '$(pyenv --version | awk '{print $2}')' located in '$(which pyenv)'.\"\n  echo \"Terraform '$(terraform --version | head --lines 1 | grep --only-matching --perl-regexp '\\K[0-9]+\\.[0-9]+\\.[0-9]+')' located in '$(which terraform)'.\"\n  # keep-sorted end\n  echo \"\"\n"
    },
    "profile": {},
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-darwin",
        "x86_64-linux"
      ],
      "allow": {
        "licenses": []
      },
      "semver": {}
    }

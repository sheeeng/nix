name: Run Pre-Commit via Nix

on:
  push:
    branches:
      - "main"
      - "unstable"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  run-pre-commit:
    name: Run Pre-Commit
    runs-on: ubuntu-latest
    environment:
      name: unstable
      deployment: false
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |
            nix
            nix-secrets
            nix-secrets-example

      - name: Mask Tokens
        run: |-
          echo "::add-mask::${{ steps.create-token.outputs.token }}"
          echo "::add-mask::${{ github.token }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            experimental-features = flakes nix-command
            keep-env-derivations = true
            keep-outputs = true
          github_access_token: ${{ steps.create-token.outputs.token }}

      - name: Setup Nix Cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          # Restore and save a cache using this key.
          # Focus on flake.lock and flake.nix as they determine actual dependencies.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          # If there's no cache hit, restore a cache by this prefix.
          # Use more granular prefixes to get better partial cache hits.
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
            nix-${{ runner.os }}-${{ hashFiles('flake.nix') }}
            nix-${{ runner.os }}-
          # Explicitly save the cache.
          save: true
          # Enable nix store caching. # https://github.com/nix-community/cache-nix-action/blob/e2cf51da82e145785f5db595f553f7cbc2ca54df/action.yml#L63
          nix: true
          # Collect garbage until the Nix store size is at most this number before trying to save a new cache.
          gc-max-store-size-linux: 4G
          # Purge caches.
          purge: true
          # Purge all versions of the cache.
          purge-prefixes: nix-${{ runner.os }}-
          # Created more than this number of seconds ago.
          purge-created: 2592000 # 2592000 seconds is 30 days.
          # Or, last accessed more than this number of seconds ago relative to the start of the `Post Cache Nix Store` step.
          purge-last-accessed: 1209600 # 1209600 seconds is 14 days.
          # Except any version with the key that is the same as the `primary-key`.
          purge-primary-key: never

      - name: Cache Pre-Commit Environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock', 'shell.nix') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Show Pre-Commit Version
        timeout-minutes: 15 # Allow sufficient buffer time for Nix to rebuild Nix store.
        run: |
          nix develop .#standard-shell --command bash -c "
            if ! command -v pre-commit &> /dev/null; then
              echo 'Missing pre-commit tool.'
              exit 1
            fi
            echo \"Found pre-commit \$(pre-commit --version | cut --delimiter=\" \" --fields=2) in Nix environment.\"
          "

      - name: Install Pre-Commit
        timeout-minutes: 10 # Nix store should already be built and cached. But, install hooks from external sources may take time.
        run: |
          nix develop .#minimal-shell --command bash -c "
            echo 'Installing pre-commit hooks...'
            pre-commit install-hooks
          "
      - name: Run Pre-Commit
        timeout-minutes: 5 # Nix store should already be built and cached. But, run hooks on all files may take time.
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |-
          nix develop .#minimal-shell --command bash -c "
            echo \"Pre-Commit Version: \$(pre-commit --version)\"
            echo 'Installing pre-commit hooks...'
            pre-commit install-hooks
            # Run pre-commit on all files for push to main branch, otherwise only on changed files.
            if [[ \"\${EVENT_NAME}\" == \"push\" && \"\${GIT_REF}\" == \"refs/heads/main\" ]]; then
              echo 'Running pre-commit on all files (push to main branch)'
              pre-commit run --all-files
            else
              echo 'Running pre-commit on changed files only'
              # For pull requests, run on files changed compared to the target branch.
              if [[ \"\${EVENT_NAME}\" == \"pull_request\" ]]; then
                pre-commit run --from-ref=origin/\${BASE_REF} --to-ref=HEAD
              else
                # For other events, run on all files as fallback.
                pre-commit run --all-files
              fi
            fi
          "

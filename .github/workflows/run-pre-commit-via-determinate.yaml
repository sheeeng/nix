name: Run Pre-Commit via Determinate

on:
  push:
    branches:
      - "main"
      - "unstable"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  run-pre-commit:
    name: Run Pre-Commit
    runs-on: ubuntu-latest
    environment:
      name: unstable
      deployment: false
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |
            nix
            nix-secrets
            nix-secrets-example

      - name: Mask Tokens
        run: |-
          echo "::add-mask::${{ steps.create-token.outputs.token }}"
          echo "::add-mask::${{ github.token }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          github-token: ${{ steps.create-token.outputs.token }}
          trust-runner-user: true
          summarize: true

      - name: Setup Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-gha-cache: "enabled"
          use-flakehub: "disabled"

      - name: Cache Pre-Commit Environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'flake.lock', 'shell.nix') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Show Pre-Commit Version
        timeout-minutes: 15 # Allow sufficient buffer time for Nix to rebuild Nix store.
        run: |
          nix develop --command bash -c "
            if ! command -v pre-commit &> /dev/null; then
              echo 'Missing pre-commit tool.'
              exit 1
            fi
            echo \"Found pre-commit \$(pre-commit --version | cut --delimiter=\" \" --fields=2) in Nix environment.\"
          "

      - name: Install Pre-Commit
        timeout-minutes: 15 # Nix store should already be built and cached. But, install hooks from external sources may take time.
        run: |
          nix develop --command bash -c "
            echo 'Installing pre-commit hooks...'
            pre-commit install-hooks
          "
      - name: Run Pre-Commit
        timeout-minutes: 5 # Nix store should already be built and cached. But, run hooks on all files may take time.
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |-
          cat > /tmp/run-pre-commit.sh << 'SCRIPT'
          echo "Pre-Commit Version: $(pre-commit --version)"
          echo 'Installing pre-commit hooks...'
          pre-commit install-hooks
          # Run pre-commit on all files for push to main branch, otherwise only on changed files.
          if [[ "${EVENT_NAME}" == "push" && "${GIT_REF}" == "refs/heads/main" ]]; then
            echo 'Running pre-commit on all files (push to main branch)'
            pre-commit run --all-files
          else
            echo 'Running pre-commit on changed files only'
            # For pull requests, run on files changed compared to the target branch.
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              pre-commit run --from-ref="origin/${BASE_REF}" --to-ref=HEAD
            else
              # For other events, run on all files as fallback.
              pre-commit run --all-files
            fi
          fi
          SCRIPT
          nix develop --command bash /tmp/run-pre-commit.sh

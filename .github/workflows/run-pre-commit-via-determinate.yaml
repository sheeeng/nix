name: Run Pre-Commit via Determinate

on:
  push:
    branches:
      - "main"
      - "unstable"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

permissions: {}

jobs:
  run-pre-commit:
    name: Run Pre-Commit
    runs-on: ubuntu-latest
    environment:
      name: update-nix-flake-lock
      deployment: false
    permissions:
      actions: write
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |
            nix
            nix-secrets
            nix-secrets-example

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: determinatesystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: determinatesystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false

      - name: Configure Nix with GitHub Token
        run: |
          mkdir --parents ~/.config/nix
          echo "access-tokens = github.com=${{ steps.create-token.outputs.token }}" >> ~/.config/nix/nix.conf

      - name: Show Pre-Commit Version
        timeout-minutes: 15 # Allow sufficient buffer time for Nix to rebuild Nix store.
        run: |
          nix develop --command bash -c "
            if ! command -v pre-commit &> /dev/null; then
              echo 'Missing pre-commit tool.'
              exit 1
            fi
            echo 'Found pre-commit $(pre-commit --version | cut --delimiter=\" \" --fields=2) in Nix environment.'
          "

      - name: Install Pre-Commit
        timeout-minutes: 15 # Nix store should already be built and cached. But, install hooks from external sources may take time.
        run: |
          nix develop --command bash -c "
            echo 'Installing pre-commit hooks...'
            pre-commit install-hooks
          "
      - name: Run Pre-Commit
        timeout-minutes: 5 # Nix store should already be built and cached. But, run hooks on all files may take time.
        run: |-
          nix develop --command bash -c "
            echo 'Pre-Commit Version: $(pre-commit --version)'
            echo 'Installing pre-commit hooks...'
            pre-commit install-hooks
            # Run pre-commit on all files for push to main branch, otherwise only on changed files.
            if [[ \"${{ github.event_name }}\" == \"push\" && \"${{ github.ref }}\" == \"refs/heads/main\" ]]; then
              echo 'Running pre-commit on all files (push to main branch)'
              pre-commit run --all-files
            else
              echo 'Running pre-commit on changed files only'
              # For pull requests, run on files changed compared to the target branch.
              if [[ \"${{ github.event_name }}\" == \"pull_request\" ]]; then
                pre-commit run --from-ref=origin/${{ github.base_ref }} --to-ref=HEAD
              else
                # For other events, run on all files as fallback.
                pre-commit run --all-files
              fi
            fi
          "

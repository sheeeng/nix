name: Validate Renovate Configuration

on:
  push:
    branches:
      - unstable
      - main
    paths: &paths
      - .github/workflows/validate-renovate-configuration.yaml
      - renovate.json
      - renovate.json5
      - .github/renovate.json
      - .github/renovate.json5
      - .gitlab/renovate.json
      - .gitlab/renovate.json5
      - .renovaterc
      - .renovaterc.json
      - .renovaterc.json5
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    name: Validate
    timeout-minutes: 3
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mask Tokens
        run: echo "::add-mask::${{ github.token }}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          trust-runner-user: true
          summarize: true
      - name: Validate Renovate Configuration
        run: |-
          nix shell nixpkgs#renovate --command renovate-config-validator --strict

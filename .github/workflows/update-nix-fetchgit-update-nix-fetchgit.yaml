name: Update Nix Fetchgit Dependencies

on:
  schedule:
    - cron: "1 2 * * 2" # At 02:01 UTC on Tuesday.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-nix-fetchgit:
    name: Update Nix Fetchgit Dependencies
    environment:
      name: unstable
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: unstable

      - name: Get App Token to Create Pull Request
        id: create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Mask Tokens
        run: |-
          echo "::add-mask::${{ steps.create-github-app-token.outputs.token }}"
          echo "::add-mask::${{ github.token }}"

      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          github-token: ${{ github.token }}
          trust-runner-user: true
          summarize: true

      - name: Configure Nix Authentication
        run: |-
          mkdir --parents "${HOME}/.config/nix"
          umask 077
          printf 'access-tokens = github.com=%s\n' \
            "${{ steps.create-github-app-token.outputs.token }}" \
            > "${HOME}/.config/nix/access-tokens.conf"
          printf '!include access-tokens.conf\n' \
            >> "${HOME}/.config/nix/nix.conf"

      - name: Update Fetchgit Dependencies
        id: update-fetchgit
        env:
          GH_TOKEN: ${{ steps.create-github-app-token.outputs.token }}
          # Set commit identity via environment variables rather than
          # git config --global. Both embed the same name and email into the
          # commit, but env vars are scoped to this step and do not mutate
          # the runner's global git configuration for subsequent steps.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          nix run nixpkgs#fd -- \
            --extension nix \
            --exclude flake.nix \
            --exec-batch \
            nix run nixpkgs#update-nix-fetchgit -- --verbose

          mapfile -t changed_files < <(git diff --name-only)

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No fetchgit dependency updates found."
            exit 0
          fi

          nix fmt -- "${changed_files[@]}"

          # shellcheck disable=SC2016
          git config --global credential.helper \
            '!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'

          branch="chore/update-nix-fetchgit"
          git switch --force-create "${branch}"
          git add --all
          git commit \
            --message "chore(deps): update nix fetchgit dependencies"
          git push --force-with-lease origin "${branch}"

          existing_pull_request="$(
            gh pr list --head "${branch}" --state open --json number \
              --jq '.[].number'
          )"

          if [[ -n "${existing_pull_request}" ]]; then
            gh pr edit "${existing_pull_request}" \
              --title "chore(deps): update nix fetchgit dependencies" \
              --body "Updates \`fetchgit\`, \`fetchFromGitHub\`, and similar pinned sources in Nix files." \
              --base unstable
            echo "Updated existing pull request #${existing_pull_request}."
            echo "pull-request-number=${existing_pull_request}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh pr create \
            --title "chore(deps): update nix fetchgit dependencies" \
            --body "Updates \`fetchgit\`, \`fetchFromGitHub\`, and similar pinned sources in Nix files." \
            --base unstable \
            --head "${branch}"
          pull_request_number="$(
            gh pr view "${branch}" --json number --jq '.number'
          )"
          echo "pull-request-number=${pull_request_number}" >> "${GITHUB_OUTPUT}"

      - name: Display Pull Request Link
        if: steps.update-fetchgit.outputs.pull-request-number != ''
        run: |-
          echo "Upsert ${{ steps.update-fetchgit.outputs.pull-request-number }} pull request."
          echo "Upsert [#${{ steps.update-fetchgit.outputs.pull-request-number }}](https://github.com/${{ github.repository }}/pull/${{ steps.update-fetchgit.outputs.pull-request-number }}) pull request." >> "${GITHUB_STEP_SUMMARY}"

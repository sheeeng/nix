name: Review Dependency

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base branch to compare against
        required: true
        type: string
      head-ref:
        description: Head branch to review
        required: true
        type: string

concurrency:
  group: "${{ github.workflow }}-${{ inputs.head-ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Review Dependency
        uses: actions/dependency-review-action@v5.0.1
        with:
          base-ref: ${{ inputs.base-ref || github.base_ref }}
          head-ref: ${{ inputs.head-ref || github.head_ref }}

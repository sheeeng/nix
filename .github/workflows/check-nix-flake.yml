name: Check Nix Flake

on:
  push:
    branches:
      - "main"
      - "unstable"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  check-nix-flake:
    name: Check Nix Flake
    runs-on: ubuntu-latest
    environment:
      name: unstable
      deployment: false
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3.4.0
        id: create-github-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |-
            nix-secrets
            nix-secrets-example
          permission-contents: read
      - name: Mask Tokens
        run: |-
          echo "::add-mask::${{ steps.create-github-app-token.outputs.token }}"
          echo "::add-mask::${{ github.token }}"
      - name: Configure Nix Authentication
        run: |-
          mkdir --parents "${HOME}/.config/nix"
          umask 077
          printf 'access-tokens = github.com=%s github.com/sheeeng/nix-secrets=%s github.com/sheeeng/nix-secrets-example=%s\n' \
            "${{ github.token }}" \
            "${{ steps.create-github-app-token.outputs.token }}" \
            "${{ steps.create-github-app-token.outputs.token }}" \
            > "${HOME}/.config/nix/access-tokens.conf"
          printf '!include access-tokens.conf\n' \
            >> "${HOME}/.config/nix/nix.conf"
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@v3.24.2
        with:
          github-token: ${{ github.token }}
          trust-runner-user: true
          summarize: true
      - name: Show Nix Version
        run: |-
          echo "Version: \`$(nix --version)\`" \
          | tee --append "${GITHUB_STEP_SUMMARY}"
      - name: Show Nix Information
        run: |-
          nix-shell --packages nix-info --run 'nix-info --markdown --sandbox --host-os' \
          | tee --append "${GITHUB_STEP_SUMMARY}"
      - name: Check Nix Flake
        run: |-
          nix --experimental-features "nix-command flakes" flake check \
          --print-build-logs \
          | tee --append "${GITHUB_STEP_SUMMARY}"

  # Keep Nixpkgs current: fail CI when the flake.lock Nixpkgs input drifts more
  # than 30 days behind (the Flake Checker default), per the FlakeHub best
  # practice. https://docs.determinate.systems/flakehub/best-practices/#update-inputs
  check-nixpkgs-currency:
    name: Check Nixpkgs Currency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Flake Currency
        uses: determinatesystems/flake-checker-action@v14
        env:
          NIX_FLAKE_CHECKER_NO_TELEMETRY: "true"
        with:
          fail-mode: true
          send-statistics: false

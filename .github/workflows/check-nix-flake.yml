name: Check Nix Flake

on:
  push:
    branches:
      - "main"
      - "unstable"
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

permissions: {}

jobs:
  check-nix-flake:
    name: Check Nix Flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          github-token: ${{ github.token }}
          trust-runner-user: true
          summarize: true
      - name: Show Nix Version
        run: |-
          echo "Version: \`$(nix --version)\`" \
          | tee --append "${GITHUB_STEP_SUMMARY}"
      - name: Show Nix Information
        run: |-
          nix-shell --packages nix-info --run 'nix-info --markdown --sandbox --host-os' \
          | tee --append "${GITHUB_STEP_SUMMARY}"
      - name: Check Nix Flake
        run: |-
          nix --experimental-features "nix-command flakes" flake check \
          --print-build-logs \
          | tee --append "${GITHUB_STEP_SUMMARY}"

  # Keep Nixpkgs current: fail CI when the flake.lock Nixpkgs input drifts more
  # than 30 days behind (the Flake Checker default), per the FlakeHub best
  # practice. https://docs.determinate.systems/flakehub/best-practices/#update-inputs
  check-nixpkgs-currency:
    name: Check Nixpkgs Currency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Flake Currency
        uses: determinatesystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          fail-mode: true

name: Check Pre-Commit

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - unstable
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

env:
  FLOX_DISABLE_METRICS: "true"

jobs:
  check-pre-commit:
    name: Check Pre-Commit
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Flox
        uses: flox/install-flox-action@ebc6882567b984bffb468828696e1ad22bbabc2d # v2.0.0
        with:
          channel: stable
          disable-metrics: true

      - name: Show Pre-Commit Version
        run: |
          flox activate -- pre-commit --version

      - name: Activate Flox Environment
        uses: flox/activate-action@d08556cc1491f3608f5338faf35cfa152dba3d5c # v1.0.0
        with:
          command: |
            flox config --set disable_metrics true
            pre-commit run --all-files

name: "Update Nix Flake Lock"

on:
  schedule:
    - cron: "2 3 * * 4" # At 03:02 UTC on Thursday.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# References:
# dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>
# https://api.github.com/users/dependabot%5Bbot%5D
#
# github-actions[bot] <github-actions[bot]@users.noreply.github.com>
# https://api.github.com/users/github-actions%5Bbot%5D
#
# https://github.com/orgs/community/discussions/26560#discussioncomment-12555758
# https://github.com/actions/checkout/blob/8e8c483db84b4bee98b60c0593521ed34d9990e8/README.md#L358

jobs:
  update-nix-flake-lock:
    runs-on: ubuntu-latest
    environment:
      name: unstable
      deployment: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-github-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |-
            nix
            nix-secrets
            nix-secrets-example

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.create-github-app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0
          ref: unstable

      - uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          github-token: ${{ steps.create-github-app-token.outputs.token }}
          trust-runner-user: true
          summarize: true

      - uses: determinatesystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        env:
          # At flake-checker-action v13 commit de924abd, send-statistics: false maps to NIX_FLAKE_CHECKER_NO_TELEMETRY=false.
          # The environment variable override is required to disable telemetry.
          # See https://github.com/DeterminateSystems/flake-checker-action/issues/134.
          NIX_FLAKE_CHECKER_NO_TELEMETRY: "true"
        with:
          flake-lock-path: "flake.lock"
          check-outdated: true
          check-owner: true
          check-supported: true
          nixpkgs-keys: "nixpkgs"
          ignore-missing-flake-lock: true
          fail-mode: false
          send-statistics: false

      - name: Update Nix Flake Lock
        id: update-nix-flake-lock
        env:
          GH_TOKEN: ${{ steps.create-github-app-token.outputs.token }}
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          nix flake update
          nix flake check

          if git diff --quiet -- flake.lock; then
            echo "All flake inputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/update-nix-flake-lock"
          git switch --force-create "${branch}"
          git add -- flake.lock
          git commit --message "chore(deps): update flake.lock"
          git push --force-with-lease \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "${branch}"

          existing_pull_request="$(
            gh pr list --head "${branch}" --state open --json number \
              --jq '.[].number'
          )"

          if [[ -n "${existing_pull_request}" ]]; then
            echo "Updated existing pull request #${existing_pull_request}."
            echo "pull-request-number=${existing_pull_request}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh pr create \
            --title "chore(deps): update flake.lock" \
            --body "Refreshes every flake input with \`nix flake update\`." \
            --base unstable \
            --head "${branch}"
          pull_request_number="$(
            gh pr view "${branch}" --json number --jq '.number'
          )"
          echo "pull-request-number=${pull_request_number}" >> "${GITHUB_OUTPUT}"

      - name: Display Pull Request Link
        run: |-
          echo "Upsert ${{ steps.update-nix-flake-lock.outputs.pull-request-number }} pull request."
          echo "Upsert [#${{ steps.update-nix-flake-lock.outputs.pull-request-number }}](https://github.com/${{ github.repository }}/pull/${{ steps.update-nix-flake-lock.outputs.pull-request-number }}) pull request." >> "${GITHUB_STEP_SUMMARY}"

name: "Update Nix Flake Lock"

on:
  schedule:
    - cron: "1 2 * * 3" # “At 02:01 on Wednesday.”
  workflow_dispatch:

permissions: {}

jobs:
  update-nix-flake-lock:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'unstable' && 'unstable' || '' }}
      deployment: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |-
            nix
            nix-secrets
            nix-secrets-example

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.create-token.outputs.token }}

      - uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Configure Nix with GitHub Token
        env:
          GITHUB_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |-
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "ssh://git@github.com/"
          mkdir --parents ~/.config/nix
          echo "access-tokens = github.com=${GITHUB_TOKEN}" >> ~/.config/nix/nix.conf

      # References:
      # dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>
      # https://api.github.com/users/dependabot%5Bbot%5D
      #
      # github-actions[bot] <github-actions[bot]@users.noreply.github.com>
      # https://api.github.com/users/github-actions%5Bbot%5D
      #
      # https://github.com/orgs/community/discussions/26560#discussioncomment-12555758
      # https://github.com/actions/checkout/blob/8e8c483db84b4bee98b60c0593521ed34d9990e8/README.md#L358

      - name: Update Nix Flake Lock
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |-
          set -o pipefail
          set -o errexit
          set -o nounset

          # Configure git identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          update_branch="chore/update-nix-flake-lock"

          while IFS=$'\t' read -r pull_request_number branch_name; do
            [[ -z "${pull_request_number}" ]] && continue
            gh pr close "${pull_request_number}" \
              --comment "Superseded by the current Nix flake lock update."
            git push origin --delete "${branch_name}" || true
          done < <(
            gh pr list \
              --base "${GITHUB_REF_NAME}" \
              --head "automation/flake-lock" \
              --state open \
              --json headRefName,number \
              --jq '.[] | "\(.number)\t\(.headRefName)"'
          )

          existing_pr_number="$(
            gh pr list \
              --base "${GITHUB_REF_NAME}" \
              --head "${update_branch}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          git fetch origin "${update_branch}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${update_branch}"; then
            git switch --create "${update_branch}" \
              --track "origin/${update_branch}"
          else
            git switch --create "${update_branch}"
          fi

          # Record current HEAD before updating, so we can detect whether
          # --commit-lock-file made a new commit with flake.lock changes.
          CHECKOUT_COMMIT_HASH=$(git rev-parse HEAD)

          # Update flake.lock file.
          nix --debug --log-format raw \
            --option commit-lockfile-summary "chore(deps): update flake.lock" \
            flake update \
            --commit-lock-file

          # Stop if flake.lock was not updated.
          if git diff --quiet "$CHECKOUT_COMMIT_HASH" HEAD -- flake.lock; then
            echo "No changes to flake.lock file, skipping pull request."
            exit 0
          fi

          # Verify all configurations evaluate successfully before pushing.
          nix eval --json .#nixosConfigurations --apply builtins.attrNames \
            | jq --raw-output '.[]' \
            | while read -r host; do
                nix eval ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
              done
          readarray -t darwin_hosts < <(
            nix eval --json .#darwinConfigurations --apply builtins.attrNames \
              | jq --raw-output '.[]'
          )
          for host in "${darwin_hosts[@]}"; do
            output=$(nix eval ".#darwinConfigurations.${host}.system.drvPath" 2>&1) \
              || {
                if echo "$output" | grep --quiet "dropped support for x86_64-darwin"; then
                  echo "Skipping ${host} (x86_64-darwin is no longer supported by nixpkgs)."
                else
                  echo "$output" >&2
                  exit 1
                fi
              }
          done

          git push --force-with-lease origin "HEAD:${update_branch}"

          if [[ -n "${existing_pr_number}" ]]; then
            echo "Updated flake lock pull request #${existing_pr_number}."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "${update_branch}" \
              --title "chore(deps): update flake.lock" \
              --body "Update flake.lock and verify all configurations."
          fi

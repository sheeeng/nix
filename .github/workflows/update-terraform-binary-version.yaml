name: Update Terraform Binary Version

on:
  schedule:
    - cron: "1 2 * * 3" # At 02:01 UTC on Wednesday.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-terraform-binary-version:
    name: Update Terraform Binary Version
    environment:
      name: unstable
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      # Required to push the automation branch.
      contents: read
      # Required so github-actions[bot] creates and updates pull requests.
      # Do NOT use the GitHub App token for gh pr create/edit — that would
      # show the App as the PR creator instead of github-actions[bot].
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: unstable

      - name: Get App Token to Create Pull Request
        id: create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # contents: write is needed to push the automation branch.
          # pull-requests permission is intentionally omitted here so that
          # PR creation uses github.token (github-actions[bot]) below.
          permission-contents: write

      - name: Mask Tokens
        run: |-
          echo "::add-mask::${{ steps.create-github-app-token.outputs.token }}"
          echo "::add-mask::${{ github.token }}"

      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          github-token: ${{ github.token }}
          trust-runner-user: true
          summarize: true

      - name: Check Flake Currency
        uses: determinatesystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        env:
          # At flake-checker-action v13 commit de924abd, send-statistics: false maps to NIX_FLAKE_CHECKER_NO_TELEMETRY=false.
          # The environment variable override is required to disable telemetry.
          # See https://github.com/DeterminateSystems/flake-checker-action/issues/134.
          NIX_FLAKE_CHECKER_NO_TELEMETRY: "true"
        with:
          flake-lock-path: "flake.lock"
          check-outdated: true
          check-owner: true
          check-supported: true
          nixpkgs-keys: "nixpkgs"
          ignore-missing-flake-lock: true
          fail-mode: false
          send-statistics: false

      - name: Update Terraform Binary Version
        id: update-terraform-binary-version
        env:
          # App token used only for git push (contents: write).
          APP_TOKEN: ${{ steps.create-github-app-token.outputs.token }}
          GITHUB_RELEASES_TOKEN: ${{ github.token }}
          # Set commit identity via environment variables rather than
          # git config --global. Both embed the same name and email into the
          # commit, but env vars are scoped to this step and do not mutate
          # the runner's global git configuration for subsequent steps.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          current_version="$(< .terraform-version)"
          latest_version="$(
            curl --fail --location --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_RELEASES_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/hashicorp/terraform/releases/latest \
              | jq --raw-output '.tag_name | ltrimstr("v")'
          )"

          if [[ "${current_version}" == "${latest_version}" ]]; then
            echo "Terraform is already current at ${current_version}."
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          declare -A target_hashes=()
          for target in darwin_amd64 darwin_arm64 linux_arm64 linux_amd64; do
            binary_url="https://releases.hashicorp.com/terraform/${latest_version}/terraform_${latest_version}_${target}.zip"
            binary_hash="$(
              nix store prefetch-file --unpack --json "${binary_url}" \
                | jq --raw-output '.hash'
            )"
            target_hashes["${target}"]="${binary_hash}"
          done

          printf '%s\n' "${latest_version}" > .terraform-version
          sed --in-place \
            -e "s#^    \"aarch64-darwin\" = \".*\";#    \"aarch64-darwin\" = \"${target_hashes[darwin_arm64]}\";#" \
            -e "s#^    \"aarch64-linux\" = \".*\";#    \"aarch64-linux\" = \"${target_hashes[linux_arm64]}\";#" \
            -e "s#^    \"x86_64-darwin\" = \".*\";#    \"x86_64-darwin\" = \"${target_hashes[darwin_amd64]}\";#" \
            -e "s#^    \"x86_64-linux\" = \".*\";#    \"x86_64-linux\" = \"${target_hashes[linux_amd64]}\";#" \
            pkgs/terraform.nix

          nix fmt -- pkgs/terraform.nix

          # shellcheck disable=SC2016
          git config --global credential.helper \
            '!f() { echo "username=x-access-token"; echo "password=${APP_TOKEN}"; }; f'

          branch="chore/update-terraform"
          git switch --force-create "${branch}"
          git add -- .terraform-version pkgs/terraform.nix
          git commit \
            --message "chore(deps): update terraform to ${latest_version}"
          git push --force-with-lease origin "${branch}"

          echo "updated=true" >> "${GITHUB_OUTPUT}"
          {
            echo "branch=${branch}"
            echo "current-version=${current_version}"
            echo "latest-version=${latest_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create or Update Pull Request
        id: create-or-update-pull-request
        if: steps.update-terraform-binary-version.outputs.updated == 'true'
        env:
          # Use github.token so GitHub attributes the PR to github-actions[bot],
          # not to the GitHub App (which would show as create-pull-request[bot]).
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          branch="${{ steps.update-terraform-binary-version.outputs.branch }}"
          current_version="${{ steps.update-terraform-binary-version.outputs.current-version }}"
          latest_version="${{ steps.update-terraform-binary-version.outputs.latest-version }}"

          existing_pull_request="$(
            gh pr list --head "${branch}" --state open --json number \
              --jq '.[].number'
          )"

          if [[ -n "${existing_pull_request}" ]]; then
            gh pr edit "${existing_pull_request}" \
              --title "chore(deps): update terraform to ${latest_version}" \
              --body "Updates the Terraform binary from \`${current_version}\` to \`${latest_version}\`." \
              --base unstable
            echo "Updated existing pull request #${existing_pull_request}."
            echo "pull-request-number=${existing_pull_request}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh pr create \
            --title "chore(deps): update terraform to ${latest_version}" \
            --body "Updates the Terraform binary from \`${current_version}\` to \`${latest_version}\`." \
            --base unstable \
            --head "${branch}"
          pull_request_number="$(
            gh pr view "${branch}" --json number --jq '.number'
          )"
          echo "pull-request-number=${pull_request_number}" >> "${GITHUB_OUTPUT}"

      - name: Display Pull Request Link
        if: steps.create-or-update-pull-request.outputs.pull-request-number != ''
        run: |-
          echo "Upsert ${{ steps.create-or-update-pull-request.outputs.pull-request-number }} pull request."
          echo "Upsert [#${{ steps.create-or-update-pull-request.outputs.pull-request-number }}](https://github.com/${{ github.repository }}/pull/${{ steps.create-or-update-pull-request.outputs.pull-request-number }}) pull request." >> "${GITHUB_STEP_SUMMARY}"

name: Update Nix Fetchgit Dependencies

on:
  schedule:
    - cron: "1 2 * * 2" # At 02:01 UTC on Tuesday.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-nix-fetchgit-dependencies:
    name: Update Nix Fetchgit Dependencies
    environment:
      name: unstable
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      # Required to push the automation branch.
      contents: read
      # Required so github-actions[bot] creates and updates pull requests.
      # Use github.token here so GitHub attributes the pull request to
      # github-actions[bot]. Pull requests created with github.token do not
      # automatically trigger pull_request workflow runs on the same repository.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: unstable

      - name: Create Nix Authentication Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-nix-auth-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |-
            nix-secrets
            nix-secrets-example
          # Read-only token scoped to the private repositories that nix run
          # fetches during fetchgit updates. Granting write to these repositories
          # is not needed and would be an overgrant.
          permission-contents: read

      - name: Create Push Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-push-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # No owner or repositories: scopes the token to this repository only.
          # A GitHub App can be added to the branch protection bypass list;
          # github.token cannot.
          permission-contents: write

      - name: Mask Tokens
        run: |-
          echo "::add-mask::${{ steps.create-nix-auth-token.outputs.token }}"
          echo "::add-mask::${{ steps.create-push-token.outputs.token }}"
          echo "::add-mask::${{ github.token }}"

      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
        with:
          github-token: ${{ github.token }}
          trust-runner-user: true
          summarize: true

      - name: Configure Nix Authentication
        run: |-
          mkdir --parents "${HOME}/.config/nix"
          umask 077
          printf 'access-tokens = github.com=%s\n' \
            "${{ steps.create-nix-auth-token.outputs.token }}" \
            > "${HOME}/.config/nix/access-tokens.conf"
          printf '!include access-tokens.conf\n' \
            >> "${HOME}/.config/nix/nix.conf"

      - name: Update and Push Fetchgit Dependencies
        id: update-fetchgit
        env:
          # Push token scoped to this repository only (contents: write).
          APP_TOKEN: ${{ steps.create-push-token.outputs.token }}
          # Set commit identity via environment variables rather than
          # git config --global. Both embed the same name and email into the
          # commit, but env vars are scoped to this step and do not mutate
          # the runner's global git configuration for subsequent steps.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          nix run nixpkgs#fd -- \
            --extension nix \
            --exclude flake.nix \
            --exec-batch \
            nix run nixpkgs#update-nix-fetchgit -- --verbose

          mapfile -t changed_files < <(git diff --name-only)

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No fetchgit dependency updates found."
            echo "has-changes=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          nix fmt -- "${changed_files[@]}"

          branch="chore/update-nix-fetchgit"
          git switch --force-create "${branch}"
          git add --all
          git commit \
            --message "chore(deps): update nix fetchgit dependencies"
          git remote set-url --push origin \
            "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force-with-lease origin "${branch}"

          echo "has-changes=true" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Create or Update Pull Request
        id: upsert-pull-request
        if: steps.update-fetchgit.outputs.has-changes == 'true'
        env:
          # Use github.token so GitHub attributes the pull request to
          # github-actions[bot], not to the App bot.
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          branch="${{ steps.update-fetchgit.outputs.branch }}"

          existing_pull_request="$(
            gh pr list --head "${branch}" --state open --json number \
              --jq '.[].number'
          )"

          if [[ -n "${existing_pull_request}" ]]; then
            gh pr edit "${existing_pull_request}" \
              --title "chore(deps): update nix fetchgit dependencies" \
              --body "Updates \`fetchgit\`, \`fetchFromGitHub\`, and similar pinned sources in Nix files." \
              --base unstable
            echo "Updated existing pull request #${existing_pull_request}."
            echo "pull-request-number=${existing_pull_request}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          gh pr create \
            --title "chore(deps): update nix fetchgit dependencies" \
            --body "Updates \`fetchgit\`, \`fetchFromGitHub\`, and similar pinned sources in Nix files." \
            --base unstable \
            --head "${branch}"
          pull_request_number="$(
            gh pr view "${branch}" --json number --jq '.number'
          )"
          echo "pull-request-number=${pull_request_number}" >> "${GITHUB_OUTPUT}"

      - name: Display Pull Request Link
        if: steps.upsert-pull-request.outputs.pull-request-number != ''
        run: |-
          echo "Upsert ${{ steps.upsert-pull-request.outputs.pull-request-number }} pull request."
          echo "Upsert [#${{ steps.upsert-pull-request.outputs.pull-request-number }}](https://github.com/${{ github.repository }}/pull/${{ steps.upsert-pull-request.outputs.pull-request-number }}) pull request." >> "${GITHUB_STEP_SUMMARY}"

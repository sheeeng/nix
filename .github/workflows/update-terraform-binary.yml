name: Update Terraform Binary

on:
  schedule:
    - cron: "2 3 * * 4" # “At 03:02 on Thursday.”
  workflow_dispatch:

permissions: {}

jobs:
  update-terraform-binary:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'unstable' && 'unstable' || '' }}
      deployment: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: nix

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.create-token.outputs.token }}

      - uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Update Terraform Binary
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          latest_version="$(
            curl --fail --location --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/hashicorp/terraform/releases/latest \
              | jq --raw-output '.tag_name | ltrimstr("v")'
          )"

          update_branch="chore/update-terraform-binary"

          while IFS=$'\t' read -r pull_request_number branch_name; do
            [[ -z "${pull_request_number}" ]] && continue
            gh pr close "${pull_request_number}" \
              --comment "Superseded by Terraform ${latest_version}."
            git push origin --delete "${branch_name}" || true
          done < <(
            gh pr list \
              --base "${GITHUB_REF_NAME}" \
              --state open \
              --json headRefName,number \
              --jq '.[] | select(.headRefName == "automation/terraform" or (.headRefName | startswith("automation/terraform-"))) | "\(.number)\t\(.headRefName)"'
          )

          existing_pr_number="$(
            gh pr list \
              --base "${GITHUB_REF_NAME}" \
              --head "${update_branch}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          git fetch origin "${update_branch}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${update_branch}"; then
            git switch --create "${update_branch}" \
              --track "origin/${update_branch}"
          else
            git switch --create "${update_branch}"
          fi

          declare -A target_hashes=()
          for target in darwin_arm64 linux_arm64 linux_amd64; do
            binary_url="https://releases.hashicorp.com/terraform/${latest_version}/terraform_${latest_version}_${target}.zip"
            binary_hash="$(
              nix store prefetch-file --unpack --json "${binary_url}" \
                | jq --raw-output '.hash'
            )"
            target_hashes["${target}"]="${binary_hash}"
          done

          printf '%s\n' "${latest_version}" > .terraform-version
          sed --in-place \
            -e "/^  terraformHashes = {/,/^  };/ s#^    \"aarch64-darwin\" = \".*\";#    \"aarch64-darwin\" = \"${target_hashes[darwin_arm64]}\";#" \
            -e "/^  terraformHashes = {/,/^  };/ s#^    \"aarch64-linux\" = \".*\";#    \"aarch64-linux\" = \"${target_hashes[linux_arm64]}\";#" \
            -e "/^  terraformHashes = {/,/^  };/ s#^    \"x86_64-linux\" = \".*\";#    \"x86_64-linux\" = \"${target_hashes[linux_amd64]}\";#" \
            home-manager/packages/terraform.nix

          if git diff --quiet -- .terraform-version home-manager/packages/terraform.nix; then
            echo "Terraform ${latest_version} and its hashes are already current."
            exit 0
          fi

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .terraform-version home-manager/packages/terraform.nix
          git commit --signoff \
            --message "chore(deps): update terraform to ${latest_version}"
          git fetch origin "${update_branch}" || true
          git push --force-with-lease origin "HEAD:${update_branch}"

          if [[ -n "${existing_pr_number}" ]]; then
            gh pr ready "${existing_pr_number}" --undo
            gh pr edit "${existing_pr_number}" \
              --title "chore(terraform): update to ${latest_version}" \
              --body "Update Terraform to ${latest_version} and refresh the binary checksums."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "${update_branch}" \
              --draft \
              --title "chore(terraform): update to ${latest_version}" \
              --body "Update Terraform to ${latest_version} and refresh the binary checksums."
          fi

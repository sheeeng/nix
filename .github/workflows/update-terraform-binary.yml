name: Update Terraform Binary

on:
  schedule:
    - cron: "17 2 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  update-terraform-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: create-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: nix

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.create-token.outputs.token }}

      - uses: determinatesystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Update Terraform Binary
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: |-
          set -o errexit
          set -o nounset
          set -o pipefail

          current_version="$(< .terraform-version)"
          latest_version="$(
            curl --fail --location --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/hashicorp/terraform/releases/latest \
              | jq --raw-output '.tag_name | ltrimstr("v")'
          )"

          if [[ "${current_version}" == "${latest_version}" ]]; then
            echo "Terraform is already current at ${current_version}."
            exit 0
          fi

          update_branch="automation/terraform-${latest_version}"
          if [[ "$(gh pr list --base "${GITHUB_REF_NAME}" --head "${update_branch}" --state open --json number --jq 'length')" != 0 ]]; then
            echo "A Terraform update pull request already exists for ${latest_version}."
            exit 0
          fi

          git switch --create "${update_branch}"

          declare -A target_hashes=()
          for target in darwin_arm64 linux_arm64 linux_amd64; do
            binary_url="https://releases.hashicorp.com/terraform/${latest_version}/terraform_${latest_version}_${target}.zip"
            binary_hash="$(
              nix store prefetch-file --unpack --json "${binary_url}" \
                | jq --raw-output '.hash'
            )"
            target_hashes["${target}"]="${binary_hash}"
          done

          printf '%s\n' "${latest_version}" > .terraform-version
          sed --in-place \
            -e "/^  terraformHashes = {/,/^  };/ s#^    \"aarch64-darwin\" = \".*\";#    \"aarch64-darwin\" = \"${target_hashes[darwin_arm64]}\";#" \
            -e "/^  terraformHashes = {/,/^  };/ s#^    \"aarch64-linux\" = \".*\";#    \"aarch64-linux\" = \"${target_hashes[linux_arm64]}\";#" \
            -e "/^  terraformHashes = {/,/^  };/ s#^    \"x86_64-linux\" = \".*\";#    \"x86_64-linux\" = \"${target_hashes[linux_amd64]}\";#" \
            home-manager/packages/terraform.nix

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .terraform-version home-manager/packages/terraform.nix
          git commit --signoff \
            --message "chore(deps): update terraform to ${latest_version}"
          git push origin "HEAD:${update_branch}"

          # Direct commits to the base branch are disabled. Keep the old flow
          # as a reference if the workflow design changes in the future.
          # git add -- .terraform-version home-manager/packages/terraform.nix
          # git commit --signoff \
          #   --message "chore(deps): update terraform to ${latest_version}"
          # git push origin "HEAD:${GITHUB_REF_NAME}"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${update_branch}" \
            --title "chore(terraform): update to ${latest_version}" \
            --body "Update Terraform to ${latest_version} and refresh the binary checksums."

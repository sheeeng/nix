name: Format with Treefmt

on:
  pull_request:
    branches:
      - main
      - unstable
    paths:
      - "**"
      - "!**/*.lock"
      - "!**/*.lock.yaml"
      - "!**/*.lock.yml"
      - "!**/*.patch"
  push:
    branches:
      - chore/**
      - main
      - unstable
    paths:
      - "**"
      - "!**/*.lock"
      - "!**/*.lock.yaml"
      - "!**/*.lock.yml"
      - "!**/*.patch"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  format-with-treefmt:
    name: Format with Treefmt
    runs-on: ubuntu-latest
    environment:
      name: unstable
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: create-github-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: sheeeng
          repositories: |-
            nix-secrets
            nix-secrets-example
      - name: Mask Tokens
        run: |-
          echo "::add-mask::${{ steps.create-github-app-token.outputs.token }}"
          echo "::add-mask::${{ github.token }}"
      - name: Configure Nix Authentication
        run: |-
          mkdir --parents "${HOME}/.config/nix"
          umask 077
          printf 'access-tokens = github.com=%s\n' \
            "${{ steps.create-github-app-token.outputs.token }}" \
            > "${HOME}/.config/nix/access-tokens.conf"
          printf '!include access-tokens.conf\n' \
            >> "${HOME}/.config/nix/nix.conf"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Nix
        uses: determinatesystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
        with:
          github-token: ${{ github.token }}
          trust-runner-user: true
          summarize: true
      - name: Check Formatting with Treefmt
        run: |-
          system="$(nix eval --impure --raw --expr 'builtins.currentSystem')"
          nix eval --raw \
            ".#checks.${system}.formatting.drvPath" \
            --no-update-lock-file \
            --show-trace
